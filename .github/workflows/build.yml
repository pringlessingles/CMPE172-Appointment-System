name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appointments
          POSTGRES_USER: appointments
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appointments -d appointments"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      PG_TEST_URL: jdbc:postgresql://localhost:5432/appointments
      DB_PASSWORD: ci-test-password
      NOTIFICATION_TOKEN: ci-test-notification-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run tests
        run: bash mvnw -B verify
      - name: Verify Compose configuration
        run: docker compose config --quiet
      - name: Build and start containers
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify container health
        run: curl --fail http://localhost:8080/health
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
