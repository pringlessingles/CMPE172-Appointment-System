spring.application.name=doctor-appointments-test
spring.datasource.url=jdbc:h2:mem:doctorappointments;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed.sql
spring.flyway.enabled=false
notifications.url=http://127.0.0.1:1/api/mock-notifications
notifications.token=test-token
notifications.timeout-ms=100
notifications.max-attempts=2
notifications.backoff-ms=0
notifications.delivery-enabled=false
notifications.recovery-delay-ms=3600000
management.endpoints.web.exposure.include=health,metrics
