# API-key authentication only: do not configure Vertex project-id or location.
clinic.ai.enabled=true
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-4-hydrogen}
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.chat.options.max-output-tokens=2048
spring.ai.google.genai.chat.options.include-thoughts=false
spring.ai.google.genai.chat.options.thinking-budget=0
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.options.task-type=SEMANTIC_SIMILARITY
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=500ms
