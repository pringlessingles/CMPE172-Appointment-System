<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Confirm appointment')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="narrow"><p class="eyebrow">REVIEW YOUR VISIT</p><h1>Confirm your appointment</h1>
<section class="card"><h2 th:text="${slot.serviceName}"></h2><p th:text="${slot.providerName}"></p><p th:text="${#temporals.format(slot.startsAt, 'EEEE, MMM d, yyyy · h:mm a')}"></p><p>Ends at <span th:text="${#temporals.format(slot.endsAt, 'h:mm a')}"></span></p><p>Booking account: <span th:text="${account.username}"></span></p></section>
<p class="notice" th:if="${slot.status != 'AVAILABLE'}">This slot is no longer available.</p>
<form th:if="${slot.status == 'AVAILABLE'}" th:action="@{/book/{id}(id=${slot.id})}" method="post" class="stack"><input type="hidden" name="serviceId" th:value="${slot.serviceId}"><label class="check"><input type="checkbox" name="confirm" value="true" required> I confirm the doctor, service, and time.</label><p>No symptoms or clinical information are needed to schedule this visit.</p><button type="submit">Book appointment</button></form><p><a th:href="@{/available}">← Back to appointments</a></p>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
