<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Appointment confirmation')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="narrow"><p class="eyebrow">YOUR VISIT</p><h1 th:text="${appointment.status == 'BOOKED' ? 'Appointment confirmed.' : 'Appointment details'}"></h1><section class="card"><p>Confirmation <strong th:text="|DAS-${appointment.id}|"></strong></p><h2 th:text="${appointment.serviceName}"></h2><p th:text="${appointment.providerName}"></p><p th:text="${#temporals.format(appointment.startsAt, 'EEEE, MMM d, yyyy · h:mm a')}"></p><p>Status: <span th:text="${appointment.status}"></span></p></section><p><a class="button" th:href="@{/my-appointments}">View my appointments</a></p><a th:href="@{/}">Back to home</a></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
