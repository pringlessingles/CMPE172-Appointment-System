<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('My appointments')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><h1>My appointments</h1><h2>Upcoming visits</h2><p th:if="${#lists.isEmpty(upcoming)}">No upcoming appointments. <a th:href="@{/available}">Find a time.</a></p>
<article class="card slot" th:each="a : ${upcoming}"><div><h3 th:text="${a.serviceName}"></h3><p th:text="${a.providerName}"></p><p th:text="${#temporals.format(a.startsAt, 'MMM d, yyyy · h:mm a')}"></p></div><form th:action="@{/my-appointments/{id}/cancel(id=${a.id})}" method="post"><button class="secondary" type="submit">Cancel appointment</button></form></article>
<h2>Appointment history</h2><p th:if="${#lists.isEmpty(history)}">No past or cancelled appointments.</p><article class="card" th:each="a : ${history}"><h3 th:text="${a.serviceName}"></h3><p><span th:text="${a.providerName}"></span> · <span th:text="${#temporals.format(a.startsAt, 'MMM d, yyyy · h:mm a')}"></span></p><strong th:text="${a.status}"></strong></article>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
