<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Available appointments')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><p class="eyebrow">FIND A TIME</p><h1>Available appointments</h1>
<form class="filters card" th:action="@{/available}" method="get"><label>Doctor<select name="providerId"><option value="">All doctors</option><option th:each="d : ${home.providers}" th:value="${d.id}" th:text="${d.name}" th:selected="${providerId != null and providerId == d.id}"></option></select></label><label>Service<select name="serviceId"><option value="">All services</option><option th:each="s : ${home.services}" th:value="${s.id}" th:text="${s.name}" th:selected="${serviceId != null and serviceId == s.id}"></option></select></label><label>Date<input name="date" type="date" th:value="${date}"></label><input type="hidden" name="size" th:value="${results.size}"><button type="submit">Apply filters</button><a th:href="@{/available}">Reset</a></form>
<p th:if="${#lists.isEmpty(results.items)}" class="notice">No appointments match these filters. Try another date or doctor.</p>
<article class="slot card" th:each="slot : ${results.items}"><div><h2 th:text="${#temporals.format(slot.startsAt, 'MMM d, yyyy · h:mm a')}"></h2><p><strong th:text="${slot.providerName}"></strong> · <span th:text="${slot.specialty}"></span></p><p th:text="${slot.serviceName}"></p></div><a class="button" th:if="${account == null or account.role() == 'CUSTOMER'}" th:href="@{/book/{id}(id=${slot.id})}">Select appointment</a></article>
<div class="pagination"><a th:if="${results.page > 0}" th:href="@{/available(providerId=${providerId},serviceId=${serviceId},date=${date},page=${results.page - 1},size=${results.size})}">← Previous</a><span th:text="|${results.totalItems} matching slots · Page ${results.page + 1} of ${results.totalPages == 0 ? 1 : results.totalPages}|"></span><a th:if="${results.page + 1 < results.totalPages}" th:href="@{/available(providerId=${providerId},serviceId=${serviceId},date=${date},page=${results.page + 1},size=${results.size})}">Next →</a></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
