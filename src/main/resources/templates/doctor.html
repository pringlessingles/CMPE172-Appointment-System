<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Doctor dashboard')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><p class="eyebrow">YOUR SCHEDULE</p><h1>Doctor dashboard</h1><h2>Add availability</h2>
<form th:action="@{/doctor/slots}" method="post" class="card filters"><label>Service<select name="serviceId" required><option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"></option></select></label><label>Starts at<input type="datetime-local" name="startsAt" required></label><label>Ends at<input type="datetime-local" name="endsAt" required></label><button type="submit">Create slot</button></form>
<h2>Availability slots</h2><article class="card slot" th:each="s : ${slots}"><div><h3 th:text="${s.serviceName}"></h3><p th:text="${#temporals.format(s.startsAt, 'MMM d, yyyy · h:mm a')}"></p><span th:text="${s.status}"></span></div><form th:if="${s.status == 'AVAILABLE'}" th:action="@{/doctor/slots/{id}/remove(id=${s.id})}" method="post"><button class="secondary" type="submit">Remove slot</button></form></article>
<h2>Patient appointments</h2><p th:if="${#lists.isEmpty(appointments)}">No patient appointments yet.</p><article class="card" th:each="a : ${appointments}"><h3 th:text="${a.patientName}"></h3><p><span th:text="${a.serviceName}"></span> · <span th:text="${#temporals.format(a.startsAt, 'MMM d, yyyy · h:mm a')}"></span></p><strong th:text="${a.status}"></strong></article>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
