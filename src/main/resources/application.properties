spring.application.name=doctor-appointments
spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:doctorappointments;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed.sql
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.shutdown=graceful
spring.datasource.hikari.connection-timeout=3000
spring.jdbc.template.query-timeout=3s
notifications.url=${NOTIFICATION_URL:http://127.0.0.1:${server.port:8080}/api/mock-notifications}
notifications.token=${NOTIFICATION_TOKEN:local-demo-token-change-for-deployment}
notifications.timeout-ms=750
notifications.max-attempts=3
notifications.backoff-ms=100
notifications.recovery-delay-ms=60000
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
