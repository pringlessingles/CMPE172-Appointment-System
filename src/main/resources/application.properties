spring.application.name=doctor-appointments
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appointments}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:appointments}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.shutdown=graceful
spring.datasource.hikari.connection-timeout=3000
spring.jdbc.template.query-timeout=3s
notifications.url=${NOTIFICATION_URL:http://127.0.0.1:${server.port:8080}/api/mock-notifications}
notifications.token=${NOTIFICATION_TOKEN:local-demo-token-change-for-deployment}
notifications.timeout-ms=750
notifications.max-attempts=3
notifications.backoff-ms=100
notifications.recovery-delay-ms=60000
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
