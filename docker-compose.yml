services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appointments
      POSTGRES_USER: appointments
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - appointment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointments -d appointments"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/appointments
      DB_USER: appointments
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      NOTIFICATION_TOKEN: ${NOTIFICATION_TOKEN:?Set NOTIFICATION_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  appointment-data:
